<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日常人際互動與溝通人格測驗</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    input, select, textarea { font-size: 16px !important; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20" x-data="commQuiz()">

  <!-- 頂部 Header -->
  <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700 sticky top-0 z-50 px-4 py-3 shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="font-bold text-base text-emerald-400 flex items-center gap-1.5">
        <span>💬</span> 日常人際溝通人格測驗
      </h1>
      <span class="text-xs px-2.5 py-1 bg-slate-700 rounded-full text-slate-300" x-text="step === 'quiz' ? '第 ' + (currentIndex + 1) + ' / 20 題' : '專屬報告'"></span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- ================= 階段一：直覺答題畫面 ================= -->
    <section x-show="step === 'quiz'" x-transition class="space-y-4">
      <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700 shadow-xl space-y-5">
        
        <!-- 進度條 -->
        <div class="space-y-1.5">
          <div class="flex justify-between text-[11px] text-slate-400">
            <span>請憑第一直覺作答，測出你的溝通人格</span>
            <span x-text="Math.round(((currentIndex + 1) / 20) * 100) + '%'"></span>
          </div>
          <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
            <div class="bg-emerald-500 h-full transition-all duration-300" :style="'width: ' + ((currentIndex + 1) / 20 * 100) + '%'"></div>
          </div>
        </div>

        <!-- 題目內容 -->
        <div class="space-y-3 pt-2 min-h-[110px] flex flex-col justify-center">
          <span class="self-start text-xs px-2.5 py-0.5 rounded-md bg-slate-700/80 text-emerald-400 border border-slate-600 font-medium" x-text="currentQuestion.tag"></span>
          <h2 class="text-base font-bold text-slate-100 leading-relaxed" x-text="currentQuestion.text"></h2>
        </div>

        <!-- 選項列表 -->
        <div class="space-y-2.5 pt-2">
          <template x-for="(opt, idx) in options" :key="idx">
            <button @click="answer(opt.score)" 
              class="w-full text-left p-3.5 rounded-xl bg-slate-700/40 hover:bg-slate-700 border border-slate-600 hover:border-emerald-500 text-sm text-slate-200 transition-all flex items-center justify-between group active:scale-[0.98]">
              <span x-text="opt.text"></span>
              <span class="text-xs text-slate-500 group-hover:text-emerald-400 font-bold">➜</span>
            </button>
          </template>
        </div>
      </div>
    </section>


    <!-- ================= 階段二：人格名片、雷達圖與剖析 ================= -->
    <section x-show="step === 'result'" x-transition class="space-y-6">
      
      <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700 shadow-xl space-y-5 text-center">
        
        <!-- 專屬 MBTI 風格人格名片 -->
        <div class="bg-gradient-to-br from-emerald-950/90 via-slate-900 to-indigo-950/80 p-5 rounded-2xl border border-emerald-500/40 shadow-lg space-y-2.5 relative overflow-hidden">
          <div class="text-4xl mb-1" x-text="persona.icon"></div>
          <div class="inline-block px-3 py-0.5 rounded-full bg-emerald-500/20 border border-emerald-400/30 text-emerald-300 text-xs font-mono font-bold tracking-wider" x-text="persona.code"></div>
          <h2 class="text-xl font-extrabold text-white tracking-wide" x-text="persona.title"></h2>
          <p class="text-xs text-emerald-200/90 font-medium italic" x-text="'「' + persona.quote + '」'"></p>
          <p class="text-xs text-slate-300 leading-relaxed text-left pt-2 border-t border-slate-700/80" x-text="persona.desc"></p>
        </div>

        <!-- 雷達圖 Canvas 容器 -->
        <div class="space-y-2">
          <span class="text-xs font-semibold text-slate-400 block">📊 四大互動維度能力分佈圖</span>
          <div class="bg-slate-900/70 p-4 rounded-xl border border-slate-700 relative flex justify-center items-center">
            <canvas id="radarChart" width="300" height="300"></canvas>
          </div>
        </div>

        <!-- 四項維度分數小卡 -->
        <div class="grid grid-cols-2 gap-2 text-left text-xs">
          <div class="bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/80 flex justify-between items-center">
            <span class="text-slate-300">🔍 客觀敘事力</span>
            <span class="font-bold text-emerald-400" x-text="scores.fact + ' / 20'"></span>
          </div>
          <div class="bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/80 flex justify-between items-center">
            <span class="text-slate-300">💓 情緒辨識度</span>
            <span class="font-bold text-emerald-400" x-text="scores.emotion + ' / 20'"></span>
          </div>
          <div class="bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/80 flex justify-between items-center">
            <span class="text-slate-300">🧭 動機洞察力</span>
            <span class="font-bold text-emerald-400" x-text="scores.motive + ' / 20'"></span>
          </div>
          <div class="bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/80 flex justify-between items-center">
            <span class="text-slate-300">🤝 彈性協商力</span>
            <span class="font-bold text-emerald-400" x-text="scores.autonomy + ' / 20'"></span>
          </div>
        </div>

        <!-- 互動盲點與成長建議 -->
        <div class="bg-slate-900/80 p-4 rounded-xl border border-indigo-500/30 text-left space-y-1.5">
          <span class="text-xs font-bold text-indigo-400 block">💡 給你的關係進化小提醒</span>
          <p class="text-xs text-slate-300 leading-relaxed" x-text="getAdviceComment()"></p>
        </div>

        <!-- 重新測驗按鈕 -->
        <button @click="restart()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-sm transition-all shadow-lg">
          🔄 重新測驗一次
        </button>
      </div>

    </section>

  </main>

  <script>
    function commQuiz() {
      return {
        step: 'quiz',
        currentIndex: 0,
        scores: {
          fact: 0,       // 客觀敘事力 (F)
          emotion: 0,    // 情緒辨識度 (E)
          motive: 0,     // 動機洞察力 (M)
          autonomy: 0    // 彈性協商力 (A)
        },
        chartInstance: null,
        
        options: [
          { text: '幾乎不符合我', score: 1 },
          { text: '偶爾才這樣', score: 2 },
          { text: '經常是這樣', score: 3 },
          { text: '完全符合我', score: 4 }
        ],

        questions: [
          { dim: 'fact', tag: '日常摩擦', text: '1. 約好見面但朋友晚到了，我開口通常會說「你比約定時間晚了20分鐘」，而不是「你每次都這麼愛遲到」。' },
          { dim: 'emotion', tag: '情緒反應', text: '2. 當心裡悶悶不樂或煩躁時，我能說出自己其實是「感到孤單、擔心或委屈」，而不只是籠統地說「我很煩」。' },
          { dim: 'motive', tag: '衝突時刻', text: '3. 看到身邊的人突然發脾氣，我會下意識去想「他最近是不是壓力很大或需要被關心」，而不是立刻覺得他很無理。' },
          { dim: 'autonomy', tag: '開口請託', text: '4. 希望另一半或家人分擔家務時，我會明確說出「你今晚方便幫忙倒垃圾嗎」，而不是嘆氣等對方自己發現。' },
          
          { dim: 'fact', tag: '意見不合', text: '5. 和人起爭執時，我習慣先把「當時具體發生了什麼事」對齊清楚，而不是急著幫對方的行為貼上自私、冷漠的標籤。' },
          { dim: 'emotion', tag: '面對指責', text: '6. 當別人說話讓我覺得受傷時，我明白這是因為「我很在意這段關係」，而不認為「全都是對方故意要害我難過」。' },
          { dim: 'motive', tag: '自我對話', text: '7. 當我對某件事感到強烈失落時，我會停下來問自己：「我內心真正在乎、渴望得到的是什麼？」' },
          { dim: 'autonomy', tag: '面對拒絕', text: '8. 當我拜託朋友幫忙卻被婉拒時，我能平靜地接受對方的難處，不會因此擺臭臉或冷戰好幾天。' },

          { dim: 'fact', tag: '傾聽習慣', text: '9. 聽別人抱怨某個人很糟糕時，我會好奇問他：「對方具體做了什麼事讓你這麼覺得？」' },
          { dim: 'emotion', tag: '表達不滿', text: '10. 溝通時，我習慣用「看到這樣的情況，我心裡有點焦慮」來開頭，而不是說「你這樣做真的很讓人受不了」。' },
          { dim: 'motive', tag: '價值選擇', text: '11. 發生誤會時，我更在乎「怎麼做才能讓彼此都覺得安心」，勝過於「一定要爭出誰對誰錯」。' },
          { dim: 'autonomy', tag: '拒絕藝術', text: '12. 當別人提出的要求超出我的能力範圍時，我能坦誠地說「我現在沒辦法做到」，而不會勉強答應後再來生悶氣。' },

          { dim: 'fact', tag: '說話分寸', text: '13. 給別人建議或回饋時，我會盡量避免使用「你總是這樣」、「你從來都不……」這類把話說死的字眼。' },
          { dim: 'emotion', tag: '情緒接納', text: '14. 發現自己正在嫉妒或感到自卑時，我會允許自己有這些情緒，不會急著責怪自己「太小心眼」。' },
          { dim: 'motive', tag: '人際界線', text: '15. 我認為自己的快樂與安全感應該由自己來照顧，不會把「讓我開心」當成伴侶或朋友的義務。' },
          { dim: 'autonomy', tag: '改變期待', text: '16. 希望對方改掉某個習慣時，我會提出具體的小步驟（例如：睡前把手機放客廳），而不是要求「你以後應該要更體貼」。' },

          { dim: 'fact', tag: '接收批評', text: '17. 別人批評我「工作態度很隨便」時，我會先冷靜問他：「是哪一份報告的哪個部分讓你覺得不夠仔細？」' },
          { dim: 'emotion', tag: '陪伴他人', text: '18. 朋友向我訴苦時，我不會急著講道理或給建議，而是先陪他一起感受那份難過或無助。' },
          { dim: 'motive', tag: '理解差異', text: '19. 即使完全不認同對方的做法，我依然相信他這麼做背後一定有他想保護的重要東西（例如尊嚴或安全感）。' },
          { dim: 'autonomy', tag: '說話語氣', text: '20. 在關係中提出要求時，我傳遞的是「如果你願意的話我會很開心」，而不是「你愛我就必須這樣做」。' }
        ],

        get currentQuestion() {
          return this.questions[this.currentIndex];
        },

        // 根據雷達圖得分動態匹配 MBTI 風格溝通人格角色
        get persona() {
          const { fact, emotion, motive, autonomy } = this.scores;
          const total = fact + emotion + motive + autonomy;
          const minScore = Math.min(fact, emotion, motive, autonomy);
          const maxScore = Math.max(fact, emotion, motive, autonomy);

          // 1. 全能高分均衡型
          if (minScore >= 16) {
            return {
              icon: '🕊️',
              code: 'FEMA · 頂級共振者',
              title: '溫柔堅定的「心靈擺渡人」',
              quote: '我看見你的情緒，也尊重你做自己的自由。',
              desc: '你的四項溝通維度宛如完美的鑽石！在關係中，你既能像記者一樣客觀還原事實、不亂貼標籤，又能像詩人般細膩接住彼此的脆弱。你懂得為自己的需求負責，從不用情緒勒索綁架他人，跟你相處會讓人感到無比安心與被理解。'
            };
          }

          // 2. 整體偏低內耗型
          if (total <= 42) {
            return {
              icon: '🦔',
              code: 'SOFT · 敏感防衛者',
              title: '外剛內柔的「刺蝟守護者」',
              quote: '我不是故意要築起高牆，只是害怕受傷。',
              desc: '在人際互動中，你其實很渴望被理解，但過去的經驗讓你習慣用「講道理、貼標籤」或「生悶氣、冷戰」來保護自己。當感覺不對勁時，你容易把委屈吞下去，或不小心用帶刺的話推開在意的人。試著對自己多一點溫柔，你不需要武裝也能被好好愛著。'
            };
          }

          // 3. 客觀敘事力最高
          if (maxScore === fact) {
            return {
              icon: '🦉',
              code: 'F-TYPE · 理性剖析者',
              title: '清晰冷靜的「事實觀察家」',
              quote: '先別急著下定論，讓我們看看真正發生了什麼。',
              desc: '你擁有極強的邏輯與客觀視角，是衝突現場最可靠的定海神針。當別人都在情緒化地翻舊帳、指責對方「你總是這樣」時，你能精準把焦點拉回具體事實，不輕易被偏見帶偏，這讓你在職場與人際協商中具備極高的公信力。'
            };
          }

          // 4. 情緒辨識度最高
          if (maxScore === emotion) {
            return {
              icon: '🦌',
              code: 'E-TYPE · 深度共感者',
              title: '細膩敏銳的「情緒雷達」',
              quote: '在講道理之前，我更在乎你心裡好不好受。',
              desc: '你擁有極為豐富的情感詞彙與共感天賦，總能第一時間察覺空氣中微妙的情緒流動。你不會用「生氣」掩蓋脆弱，也懂得陪伴朋友走過低谷而不急著說教。身邊的人只要跟你聊過天，往往會覺得心裡的石頭放下了一大半。'
            };
          }

          // 5. 動機洞察力最高
          if (maxScore === motive) {
            return {
              icon: '🐋',
              code: 'M-TYPE · 靈魂潛行者',
              title: '看透本質的「需求解碼師」',
              quote: '所有帶刺的語言背後，都藏著一顆渴望被愛的心。',
              desc: '你有一雙能穿透表面行為的眼睛。當別人被對方的難聽話語激怒時，你卻能看見他背後未被滿足的恐懼與渴望；同時你也很懂得覺察自己內心真正的需要，不輕易陷入「爭輸贏」的無意義內耗，擁有極高的人際智慧。'
            };
          }

          // 6. 彈性協商力最高
          return {
            icon: '🦊',
            code: 'A-TYPE · 邊界建築師',
            title: '自在坦率的「邊界魔法師」',
            quote: '我真誠地邀請你，也完全尊重你說不的權利。',
            desc: '你在關係中展現出極佳的鬆弛感與界線意識！你從不叫別人「猜你的心思」，總能把期待化為具體可行的請求；更難得的是，你既敢於坦率拒絕不合理的要求，也能平靜接受別人的拒絕，是現代人際關係中最健康的「不內耗代表」。'
          };
        },

        answer(score) {
          const dim = this.currentQuestion.dim;
          this.scores[dim] += score;

          if (this.currentIndex < this.questions.length - 1) {
            this.currentIndex++;
          } else {
            this.step = 'result';
            setTimeout(() => {
              this.renderChart();
            }, 100);
          }
        },

        renderChart() {
          const ctx = document.getElementById('radarChart').getContext('2d');
          const { fact, emotion, motive, autonomy } = this.scores;

          if (this.chartInstance) {
            this.chartInstance.destroy();
          }

          this.chartInstance = new Chart(ctx, {
            type: 'radar',
            data: {
              labels: ['客觀敘事力', '情緒辨識度', '動機洞察力', '彈性協商力'],
              datasets: [{
                label: '溝通風格得分',
                data: [fact, emotion, motive, autonomy],
                backgroundColor: 'rgba(16, 185, 129, 0.25)',
                borderColor: 'rgba(16, 185, 129, 1)',
                pointBackgroundColor: 'rgba(16, 185, 129, 1)',
                pointBorderColor: '#fff',
                borderWidth: 2,
                pointRadius: 4
              }]
            },
            options: {
              responsive: true,
              scales: {
                r: {
                  min: 4,
                  max: 20,
                  ticks: {
                    stepSize: 4,
                    color: '#94a3b8',
                    backdropColor: 'transparent',
                    font: { size: 10 }
                  },
                  grid: { color: '#334155' },
                  angleLines: { color: '#334155' },
                  pointLabels: {
                    color: '#f8fafc',
                    font: { size: 12, weight: 'bold' }
                  }
                }
              },
              plugins: {
                legend: { display: false }
              }
            }
          });
        },

        getAdviceComment() {
          const { fact, emotion, motive, autonomy } = this.scores;
          const minScore = Math.min(fact, emotion, motive, autonomy);

          if (minScore >= 16) {
            return "你的溝通雷達圖幾乎沒有短板！建議你繼續保持這份覺察，在面對高壓情境或親密關係的深水區時，你已經具備足夠的心理韌性去創造雙贏對話。";
          }

          if (minScore === fact) {
            return "【成長關鍵：把「評價」還原成「事實」】在情緒上頭時，你較容易無意識地使用「你總是……」、「你很自私」等主觀標籤。下次開口前試著深呼吸，練習只說出「眼見為憑的具體事件」，對方的防衛心會瞬間降低一半。";
          } else if (minScore === emotion) {
            return "【成長關鍵：允許「脆弱」被看見】你在表達內心真實感受上較為保留，習慣用「生氣、不耐煩」或「講道理」來包裝內在的不安與失落。試著多練習說出「我其實有點擔心／難過」，真誠的脆弱往往是拉近關係的鑰匙。";
          } else if (minScore === motive) {
            return "【成長關鍵：看見行為背後的「渴望」】衝突當下你容易被對方的表面態度激怒，陷入「誰對誰錯」的拉鋸戰。試著在心裡多問一句「我們彼此真正在乎的需求是什麼」，往往能跳脫僵局找到新的出口。";
          } else {
            return "【成長關鍵：用「具體邀請」取代「暗示期待」】在提出需求時，有時你會因為怕被拒絕而選擇「等對方自己猜」，或在被拒絕時感到受傷。練習把期待化為「具體且允許對方說不的邀請」，會讓彼此的相處更輕鬆自在。";
          }
        },

        restart() {
          this.step = 'quiz';
          this.currentIndex = 0;
          this.scores = { fact: 0, emotion: 0, motive: 0, autonomy: 0 };
        }
      }
    }
  </script>
</body>
            </html>
