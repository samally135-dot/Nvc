<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>日常心境與生活風格小測驗</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    input, select, textarea { font-size: 16px !important; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-20" x-data="commQuiz()">

  <!-- 頂部 Header -->
  <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700 sticky top-0 z-50 px-4 py-3 shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="font-bold text-base text-emerald-400 flex items-center gap-1.5">
        <span>🧩</span> 日常心境與生活風格小測驗
      </h1>
      <span class="text-xs px-2.5 py-1 bg-slate-700 rounded-full text-slate-300" x-text="step === 'quiz' ? '第 ' + (currentIndex + 1) + ' / 20 題' : '專屬人格'"></span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- ================= 階段一：直覺答題畫面 ================= -->
    <section x-show="step === 'quiz'" x-transition class="space-y-4">
      <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700 shadow-xl space-y-5">
        
        <!-- 進度條 -->
        <div class="space-y-1.5">
          <div class="flex justify-between text-[11px] text-slate-400">
            <span>憑直覺選出最符合你日常狀態的選項</span>
            <span x-text="Math.round(((currentIndex + 1) / 20) * 100) + '%'"></span>
          </div>
          <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
            <div class="bg-emerald-500 h-full transition-all duration-300" :style="'width: ' + ((currentIndex + 1) / 20 * 100) + '%'"></div>
          </div>
        </div>

        <!-- 題目內容 -->
        <div class="space-y-3 pt-2 min-h-[110px] flex flex-col justify-center">
          <span class="self-start text-xs px-2.5 py-0.5 rounded-md bg-slate-700/80 text-emerald-400 border border-slate-600 font-medium" x-text="currentQuestion.tag"></span>
          <h2 class="text-base font-bold text-slate-100 leading-relaxed" x-text="currentQuestion.text"></h2>
        </div>

        <!-- 選項列表 (無預設立場的自然選項) -->
        <div class="space-y-2.5 pt-2">
          <template x-for="(opt, idx) in options" :key="idx">
            <button @click="answer(opt.score)" 
              class="w-full text-left p-3.5 rounded-xl bg-slate-700/40 hover:bg-slate-700 border border-slate-600 hover:border-emerald-500 text-sm text-slate-200 transition-all flex items-center justify-between group active:scale-[0.98]">
              <span x-text="opt.text"></span>
              <span class="text-xs text-slate-500 group-hover:text-emerald-400 font-bold">➜</span>
            </button>
          </template>
        </div>
      </div>
    </section>


    <!-- ================= 階段二：人格名片、雷達圖與剖析 ================= -->
    <section x-show="step === 'result'" x-transition class="space-y-6">
      
      <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700 shadow-xl space-y-5 text-center">
        
        <!-- 專屬 MBTI 風格溝通人格名片 -->
        <div class="bg-gradient-to-br from-emerald-950/90 via-slate-900 to-indigo-950/80 p-5 rounded-2xl border border-emerald-500/40 shadow-lg space-y-2.5 relative overflow-hidden">
          <div class="text-4xl mb-1" x-text="persona.icon"></div>
          <div class="inline-block px-3 py-0.5 rounded-full bg-emerald-500/20 border border-emerald-400/30 text-emerald-300 text-xs font-mono font-bold tracking-wider" x-text="persona.code"></div>
          <h2 class="text-xl font-extrabold text-white tracking-wide" x-text="persona.title"></h2>
          <p class="text-xs text-emerald-200/90 font-medium italic" x-text="'「' + persona.quote + '」'"></p>
          <p class="text-xs text-slate-300 leading-relaxed text-left pt-2 border-t border-slate-700/80" x-text="persona.desc"></p>
        </div>

        <!-- 雷達圖 Canvas 容器 -->
        <div class="space-y-2">
          <span class="text-xs font-semibold text-slate-400 block">📊 四大潛在心智維度分佈圖</span>
          <div class="bg-slate-900/70 p-4 rounded-xl border border-slate-700 relative flex justify-center items-center">
            <canvas id="radarChart" width="300" height="300"></canvas>
          </div>
        </div>

        <!-- 四項維度分數小卡 -->
        <div class="grid grid-cols-2 gap-2 text-left text-xs">
          <div class="bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/80 flex justify-between items-center">
            <span class="text-slate-300">🔍 客觀敘事力</span>
            <span class="font-bold text-emerald-400" x-text="scores.fact + ' / 20'"></span>
          </div>
          <div class="bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/80 flex justify-between items-center">
            <span class="text-slate-300">💓 情緒辨識度</span>
            <span class="font-bold text-emerald-400" x-text="scores.emotion + ' / 20'"></span>
          </div>
          <div class="bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/80 flex justify-between items-center">
            <span class="text-slate-300">🧭 動機洞察力</span>
            <span class="font-bold text-emerald-400" x-text="scores.motive + ' / 20'"></span>
          </div>
          <div class="bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/80 flex justify-between items-center">
            <span class="text-slate-300">🤝 彈性協商力</span>
            <span class="font-bold text-emerald-400" x-text="scores.autonomy + ' / 20'"></span>
          </div>
        </div>

        <!-- 互動盲點與成長建議 -->
        <div class="bg-slate-900/80 p-4 rounded-xl border border-indigo-500/30 text-left space-y-1.5">
          <span class="text-xs font-bold text-indigo-400 block">💡 專屬心態盲點與日常小貼士</span>
          <p class="text-xs text-slate-300 leading-relaxed" x-text="getAdviceComment()"></p>
        </div>

        <!-- 重新測驗按鈕 -->
        <button @click="restart()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-sm transition-all shadow-lg">
          🔄 重新測驗一次
        </button>
      </div>

    </section>

  </main>

  <script>
    function commQuiz() {
      return {
        step: 'quiz',
        currentIndex: 0,
        scores: {
          fact: 0,       // 客觀敘事力
          emotion: 0,    // 情緒辨識度
          motive: 0,     // 動機洞察力
          autonomy: 0    // 彈性協商力
        },
        chartInstance: null,
        
        options: [
          { text: '極少發生在我身上', score: 1 },
          { text: '偶爾會這樣', score: 2 },
          { text: '經常是這樣', score: 3 },
          { text: '完全就是我的日常', score: 4 }
        ],

        // 20道完全打散、極度生活化且沒有標準答案導向的心理情境題
        questions: [
          { dim: 'fact', tag: '生活場景', text: '1. 回到家發現客廳很亂時，我心裡浮現的第一個念頭通常是「具體有哪些東西散落各處」，而不是「為什麼大家總是不收拾」。' },
          { dim: 'emotion', tag: '內心劇場', text: '2. 當計畫被打亂、行程被迫延遲時，我能很快察覺到自己心裡究竟是感到「慌亂、疲憊還是無奈」。' },
          { dim: 'motive', tag: '日常觀察', text: '3. 逛街或搭捷運時，我常會忍不住去想擦身而過的陌生人此時此刻心裡可能正在煩惱些什麼。' },
          { dim: 'autonomy', tag: '生活習慣', text: '4. 與朋友聚會決定聚餐地點時，我習慣直接說出自己想吃哪一種類型的餐廳，而不是讓大家一直猜。' },
          
          { dim: 'fact', tag: '記憶方式', text: '5. 回憶上週發生的爭執或誤會時，我腦海中浮現的畫面多半像記錄片一樣，是當時各自說了什麼、做了什麼。' },
          { dim: 'emotion', tag: '情緒消化', text: '6. 面對突如其來的低潮或沮喪，我習慣先給自己一段安靜發呆的時間，而不是強迫自己立刻振作起來。' },
          { dim: 'motive', tag: '人際直覺', text: '7. 聽到身邊的人講出不太好聽的狠話時，我通常不會馬上生氣，而是會想他是不是最近遇到了什麼過不去的關卡。' },
          { dim: 'autonomy', tag: '個人界線', text: '8. 當朋友臨時約局但我當下真的很累想休息時，我能輕鬆自然地拒絕，而不會內疚一整晚。' },

          { dim: 'fact', tag: '資訊接收', text: '9. 閱讀網路上的爭議新聞或貼文時，我會習慣先找出事件的脈絡與時間點，再決定自己的看法。' },
          { dim: 'emotion', tag: '情緒表達', text: '10. 當我覺得心裡很受傷或委屈時，我身邊比較親近的人通常能從我的眼神或語調中感受到。' },
          { dim: 'motive', tag: '價值觀感', text: '11. 我經常覺得，世界上大多數的衝突與對立，其實都源自於彼此心裡對「安全感」或「被重視」的渴望。' },
          { dim: 'autonomy', tag: '期待管理', text: '12. 對於身邊的人，我習慣抱持「每個人都有自己的生活節奏」的心態，不太會奢望別人照著我的期待過日子。' },

          { dim: 'fact', tag: '自我審視', text: '13. 檢討自己今天的表現時，我傾向一碼歸一碼地看哪些事情做得好、哪些需要調整，而不是直接否定自己的全部。' },
          { dim: 'emotion', tag: '共感體驗', text: '14. 看電影或影集時，我很容易被主角內心深處那種「孤單卻又倔強」的時刻給觸動到鼻酸。' },
          { dim: 'motive', tag: '心態模式', text: '15. 面對別人的反覆無常或情緒起伏，我內心比較多的是好奇與理解，而不是覺得對方很麻煩。' },
          { dim: 'autonomy', tag: '日常選擇', text: '16. 面對生活中的大大小小決定，我通常很清楚這是我自己的選擇，就算結果不如預期也能自己承擔。' },

          { dim: 'fact', tag: '描述事情', text: '17. 向別人轉述一件發生的事情時，我會盡量講得像發生在眼前一樣具體，少用「很誇張」、「超離譜」這種形容詞。' },
          { dim: 'emotion', tag: '心理韌性', text: '18. 當心裡累積太多情緒快要爆炸時，我會透過寫字、聽音樂或散步等方式，把那些情緒好好宣洩出來。' },
          { dim: 'motive', tag: '同理視角', text: '19. 即使某個公眾人物或同事的作風我很不喜歡，我依然能理解他所處的位置有他的難處與侷限。' },
          { dim: 'autonomy', tag: '人際互動', text: '20. 在團體裡要分配任務或提出合作時，我習慣用「大家看看這樣分工行不行」的討論語氣，而不是直接指派。' }
        ],

        get currentQuestion() {
          return this.questions[this.currentIndex];
        },

        answer(score) {
          const dim = this.currentQuestion.dim;
          this.scores[dim] += score;

          if (this.currentIndex < this.questions.length - 1) {
            this.currentIndex++;
          } else {
            this.step = 'result';
            setTimeout(() => {
              this.renderChart();
            }, 100);
          }
        },

        renderChart() {
          const ctx = document.getElementById('radarChart').getContext('2d');
          const { fact, emotion, motive, autonomy } = this.scores;

          if (this.chartInstance) {
            this.chartInstance.destroy();
          }

          this.chartInstance = new Chart(ctx, {
            type: 'radar',
            data: {
              labels: ['客觀敘事力', '情緒辨識度', '動機洞察力', '彈性協商力'],
              datasets: [{
                label: '心智風格得分',
                data: [fact, emotion, motive, autonomy],
                backgroundColor: 'rgba(16, 185, 129, 0.25)',
                borderColor: 'rgba(16, 185, 129, 1)',
                pointBackgroundColor: 'rgba(16, 185, 129, 1)',
                pointBorderColor: '#fff',
                borderWidth: 2,
                pointRadius: 4
              }]
            },
            options: {
              responsive: true,
              scales: {
                r: {
                  min: 4,
                  max: 20,
                  ticks: {
                    stepSize: 4,
                    color: '#94a3b8',
                    backdropColor: 'transparent',
                    font: { size: 10 }
                  },
                  grid: { color: '#334155' },
                  angleLines: { color: '#334155' },
                  pointLabels: {
                    color: '#f8fafc',
                    font: { size: 12, weight: 'bold' }
                  }
                }
              },
              plugins: {
                legend: { display: false }
              }
            }
          });
        },

        get persona() {
          const { fact, emotion, motive, autonomy } = this.scores;
          const total = fact + emotion + motive + autonomy;
          const minScore = Math.min(fact, emotion, motive, autonomy);
          const maxScore = Math.max(fact, emotion, motive, autonomy);

          if (minScore >= 16) {
            return {
              icon: '🕊️',
              code: 'FEMA · 全能平衡者',
              title: '內心清明、溫柔而有力量的「心靈擺渡人」',
              quote: '看得清現實的形狀，也接得住生命的重量。',
              desc: '你的心智狀態展現出極其罕見的流動與平衡！你既擁有冷靜客觀的敘事眼光，不被情緒帶著走；又具備細膩的同理心與宏觀的動機洞察。你在生活中有著極佳的邊界感，既不強求他人也不消耗自己，是眾人眼中無比安心的存在。'
            };
          }

          if (total <= 42) {
            return {
              icon: '🦔',
              code: 'SOFT · 內心防衛者',
              title: '外表隨性、內心敏銳的「刺蝟守護者」',
              quote: '我只是習慣把柔軟藏在心底，不想輕易受傷。',
              desc: '在日常生活中，你其實擁有非常豐富的內心世界與敏銳的感受力，但由於過去承受過不少生活壓力，讓你習慣在人際互動中保持防備。有時你寧可自己把委屈吞下，也不願多說。給自己多一點空間吧，你比想像中更值得被溫柔以待。'
            };
          }

          if (maxScore === fact) {
            return {
              icon: '🦉',
              code: 'F-TYPE · 理性觀察家',
              title: '思路清晰、追求真相的「事實解碼員」',
              quote: '讓證據說話，生活自然會變得簡單許多。',
              desc: '你擁有一雙極其銳利的理性眼睛！當周遭的人深陷情緒漩渦、互相抱怨時，你總能像局外人一樣冷靜看清事情的本質與時間脈絡。這種不隨波逐流的特質，讓你無論在學業、工作或應對複雜狀況時，都顯得特別可靠。'
            };
          }

          if (maxScore === emotion) {
            return {
              icon: '🦌',
              code: 'E-TYPE · 深度共感者',
              title: '敏銳溫柔、情感豐沛的「心靈氣象台」',
              quote: '空氣中每一絲細微的波動，我都輕輕接住了。',
              desc: '你的情感雷達極度靈敏！你對於自己內心的喜怒哀樂有著很深的覺察，也能毫不費力地共情身邊人的脆弱與無奈。你從不吝嗇給予陪伴，只要身邊的人心情不好，往往第一個就會想到找你傾訴。'
            };
          }

          if (maxScore === motive) {
            return {
              icon: '🐋',
              code: 'M-TYPE · 靈魂潛行者',
              title: '看透本質、充滿哲思的「底層守望者」',
              quote: '在行為的表面之下，藏著每個人靈魂的渴求。',
              desc: '你有著一顆老靈魂，習慣去探索人類行為背後的深層動機。面對別人的無理取鬧或古怪脾氣，你很少第一時間動怒，而是會去想對方究竟在恐懼什麼。這種深刻的同理與理解力，使你散發著一種沉穩而智慧的氣場。'
            };
          }

          return {
            icon: '🦊',
            code: 'A-TYPE · 邊界魔法師',
            title: '鬆弛有度、活得通透的「自由航海家」',
            quote: '我為自己的人生負責，也把自由還給每個人。',
            desc: '你在人際關係中擁有極高的「鬆弛感」！你既懂得在生活中為自己爭取空間、坦然拒絕不喜歡的事，也不會過度干涉或期待別人配合你。這種乾淨俐落、互相尊重的相處風格，讓你的周遭總是圍繞著舒服而沒有壓力的氛圍。'
          };
        },

        getAdviceComment() {
          const { fact, emotion, motive, autonomy } = this.scores;
          const minScore = Math.min(fact, emotion, motive, autonomy);

          if (minScore >= 16) {
            return "你的各項心智維度都發展得很平均！在面對生活的風浪時，你已經具備足夠的內在支撐力，繼續保持這份覺察與彈性即可。";
          }

          if (minScore === fact) {
            return "【日常心態小提醒：回到眼見為憑的事實】當生活不如意或起摩擦時，你比較容易陷入主觀的焦慮或放大負面情緒。試著在腦中把「我覺得大家都在針對我」還原成「今天發生了哪三件事」，內心的緊繃感會減輕很多。";
          } else if (minScore === emotion) {
            return "【日常心態小提醒：練習和自己的情緒做朋友】你習慣把真實的情緒（如疲憊、失落）壓在心裡默默消化。試著給自己允許脆弱的空間，哪怕只是跟信任的人說一句「我今天真的有點累」，也能釋放掉不少心理負擔。";
          } else if (minScore === motive) {
            return "【日常心態小提醒：多留一點好奇心給他人】當周遭的人事物不如預期時，你容易直接感到煩躁。試著在心裡多給自己一個問號：「他這麼做，背後會不會其實有他的難處呢？」這會讓你看待世界的方式變得更柔軟。";
          } else {
            return "【日常心態小提醒：把期待化為清楚的邀請】在生活或人際中，你常常因為怕麻煩別人而選擇默默自己扛，或習慣心裡暗自期待別人主動發現。試著學習大方開口表達你的需求，你會發現世界比你想的好溝通。";
          }
        },

        restart() {
          this.step = 'quiz';
          this.currentIndex = 0;
          this.scores = { fact: 0, emotion: 0, motive: 0, autonomy: 0 };
        }
      }
    }
  </script>
</body>
</html>
