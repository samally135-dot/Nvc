<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>微型人際關係體質檢測與交流站</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    input, select, textarea { font-size: 16px !important; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-24" x-data="appData()">

  <!-- 頂部導覽列 -->
  <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700 sticky top-0 z-50 px-4 py-3 shadow-md">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="font-bold text-xs md:text-sm text-emerald-400 flex items-center gap-1 truncate">
        <span>🔍</span> 人際體質測驗與交流站
      </h1>
      
      <!-- 三頁式切換按鈕 -->
      <div class="flex bg-slate-900/80 p-1 rounded-xl border border-slate-700 shrink-0 text-xs">
        <button @click="currentTab = 'quiz'" 
          :class="currentTab === 'quiz' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'"
          class="px-2.5 py-1.5 rounded-lg font-medium transition-all">
          📝 測驗
        </button>
        <button @click="currentTab = 'form'" 
          :class="currentTab === 'form' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'"
          class="px-2.5 py-1.5 rounded-lg font-medium transition-all">
          ✍️ 手動記帳
        </button>
        <button @click="currentTab = 'board'" 
          :class="currentTab === 'board' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400 hover:text-white'"
          class="px-2.5 py-1.5 rounded-lg font-medium transition-all flex items-center gap-1">
          <span>📌 交流站</span>
          <span class="bg-slate-800 px-1.5 py-0.2 rounded-full text-[10px]" x-text="posts.length"></span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-6">

    <!-- ================= 第一頁：20題隱晦情境測驗 ================= -->
    <section x-show="currentTab === 'quiz'" x-transition class="space-y-4">
      <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700 shadow-xl space-y-4" x-show="!quizCompleted">
        <div class="flex justify-between items-center border-b border-slate-700 pb-2">
          <h2 class="text-sm font-bold text-emerald-400">🧠 內在人際風格與體質心測</h2>
          <span class="text-xs text-slate-400" x-text="'第 ' + (currentQIndex + 1) + ' / 20 題'"></span>
        </div>

        <!-- 進度條 -->
        <div class="w-full bg-slate-700 h-1.5 rounded-full overflow-hidden">
          <div class="bg-emerald-500 h-full transition-all duration-300" :style="'width: ' + ((currentQIndex + 1) / 20 * 100) + '%'"></div>
        </div>

        <!-- 題目與選項 -->
        <div class="space-y-3 pt-2">
          <p class="text-sm font-medium text-slate-200 leading-relaxed" x-text="questions[currentQIndex].q"></p>
          <div class="space-y-2 pt-2">
            <template x-for="(opt, oIndex) in questions[currentQIndex].options" :key="oIndex">
              <button type="button" @click="answerQuestion(opt.type)"
                class="w-full text-left bg-slate-900/70 hover:bg-emerald-950/40 border border-slate-700 hover:border-emerald-500/50 p-3 rounded-xl text-xs text-slate-300 transition-all flex items-center gap-2">
                <span class="w-5 h-5 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center shrink-0 text-[10px] text-emerald-400 font-bold" x-text="['A','B','C','D'][oIndex]"></span>
                <span x-text="opt.text"></span>
              </button>
            </template>
          </div>
        </div>
      </div>

      <!-- 測驗結果畫面 -->
      <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700 shadow-xl space-y-4" x-show="quizCompleted" x-transition>
        <div class="text-center space-y-2 border-b border-slate-700 pb-4">
          <span class="text-3xl" x-text="resultPersona.emoji"></span>
          <h2 class="text-base font-bold text-emerald-400" x-text="resultPersona.title"></h2>
          <p class="text-xs text-slate-300 leading-relaxed px-2" x-text="resultPersona.desc"></p>
        </div>

        <div class="bg-slate-900/70 p-3.5 rounded-xl border border-slate-700 space-y-3 text-xs">
          <div class="flex justify-between items-center text-slate-300">
            <span>測驗對應特質代號：</span>
            <span class="font-bold text-emerald-400" x-text="resultPersona.type"></span>
          </div>
          <div class="flex justify-between items-center text-slate-300">
            <span>建議感情/人際幸福感預設：</span>
            <span class="font-bold text-amber-400" x-text="resultPersona.suggestedHappiness + ' / 10分'"></span>
          </div>
        </div>

        <!-- 一鍵帶入並發布到交流站 -->
        <div class="space-y-2 pt-2">
          <label class="text-xs text-slate-300 font-medium">發布身份設定</label>
          <div class="flex items-center gap-3">
            <label class="flex items-center gap-1.5 text-sm cursor-pointer">
              <input type="checkbox" x-model="form.isAnonymous" class="rounded bg-slate-700 text-emerald-500">
              <span class="text-xs">匿名發布</span>
            </label>
            <input x-show="!form.isAnonymous" type="text" x-model="form.nickname" placeholder="請輸入您的暱稱" class="flex-1 bg-slate-700/80 border border-slate-600 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-emerald-400">
          </div>
        </div>

        <button type="button" @click="submitQuizResult()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs shadow-xl transition-all">
          🚀 將此測驗結果與感想同步至雲端交流站
        </button>
        <button type="button" @click="resetQuiz()" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-300 py-2 rounded-xl text-xs transition-all">
          🔄 重新測驗
        </button>
      </div>
    </section>


    <!-- ================= 第二頁：手動記帳表單 ================= -->
    <section x-show="currentTab === 'form'" x-transition class="space-y-5">
      <div class="bg-slate-800 rounded-2xl p-5 border border-slate-700 shadow-xl space-y-4">
        <h2 class="text-md font-semibold text-slate-200 border-b border-slate-700 pb-2 flex justify-between items-center">
          <span>📝 記錄一筆人際互動體質</span>
          <span class="text-xs text-slate-400">雲端同步</span>
        </h2>

        <div class="space-y-2">
          <label class="text-xs text-slate-300 font-medium">發布身份</label>
          <div class="flex items-center gap-3">
            <label class="flex items-center gap-1.5 text-sm cursor-pointer">
              <input type="checkbox" x-model="form.isAnonymous" class="rounded bg-slate-700 text-emerald-500">
              <span class="text-xs">匿名發布</span>
            </label>
            <input x-show="!form.isAnonymous" type="text" x-model="form.nickname" placeholder="請輸入您的暱稱" class="flex-1 bg-slate-700/80 border border-slate-600 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-emerald-400">
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-xs text-slate-300 font-medium">關係類型</label>
          <div class="grid grid-cols-3 gap-2">
            <template x-for="type in ['親情', '友情', '愛情']" :key="type">
              <button type="button" @click="form.relationType = type"
                :class="form.relationType === type ? 'bg-emerald-600 text-white border-emerald-500 shadow' : 'bg-slate-700/50 text-slate-400 border-slate-600'"
                class="py-2.5 border rounded-xl text-xs font-medium transition-all" x-text="type"></button>
            </template>
          </div>
        </div>

        <div class="bg-slate-900/60 p-3.5 rounded-xl border border-red-500/30 space-y-2">
          <div class="flex justify-between text-xs">
            <span class="text-red-400 font-bold">🔴 投入成本 (時間/精神/代價)</span>
            <span class="text-red-400 font-bold text-sm" x-text="form.costScore + ' 分'"></span>
          </div>
          <textarea x-model="form.costDesc" rows="2" placeholder="付出的時間、精神或代價..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-xs text-white focus:outline-none focus:border-red-400"></textarea>
          <input type="range" min="1" max="10" x-model.number="form.costScore" class="w-full accent-red-500 h-2 bg-slate-700 rounded-lg cursor-pointer">
        </div>

        <div class="bg-slate-900/60 p-3.5 rounded-xl border border-emerald-500/30 space-y-2">
          <div class="flex justify-between text-xs">
            <span class="text-emerald-400 font-bold">🟢 獲得收穫 (情感回饋/支持)</span>
            <span class="text-emerald-400 font-bold text-sm" x-text="form.rewardScore + ' 分'"></span>
          </div>
          <textarea x-model="form.rewardDesc" rows="2" placeholder="得到的支持、回饋或收穫..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-xs text-white focus:outline-none focus:border-emerald-400"></textarea>
          <input type="range" min="1" max="10" x-model.number="form.rewardScore" class="w-full accent-emerald-500 h-2 bg-slate-700 rounded-lg cursor-pointer">
        </div>

        <div class="bg-slate-900/60 p-3.5 rounded-xl border border-amber-500/30 space-y-2">
          <div class="flex justify-between text-xs text-amber-400">
            <span class="font-bold">✨ 內在幸福感指數 <span x-text="getEmoji(form.happiness)"></span></span>
            <span class="font-bold text-sm" x-text="form.happiness + ' / 10'"></span>
          </div>
          <input type="range" min="1" max="10" x-model.number="form.happiness" class="w-full accent-amber-500 h-2 bg-slate-700 rounded-lg cursor-pointer">
        </div>

        <div class="bg-slate-900/60 p-3.5 rounded-xl border border-indigo-500/30 space-y-2">
          <label class="text-xs text-indigo-400 font-bold block">💬 互動總結與反思感想</label>
          <textarea x-model="form.reflection" rows="2" placeholder="寫下你對這段關係或這次互動的感悟與反思..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-xs text-white focus:outline-none focus:border-indigo-400"></textarea>
        </div>

        <button type="button" @click="submitToCloud()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs shadow-xl transition-all">
          🚀 上傳至雲端並前往交流站
        </button>
      </div>
    </section>


    <!-- ================= 第三頁：交流站列表 ================= -->
    <section x-show="currentTab === 'board'" x-transition class="space-y-4">
      <div class="flex justify-between items-center bg-slate-800 p-3 rounded-xl border border-slate-700 shadow">
        <h3 class="text-xs font-bold text-slate-200">📌 大家的心得與交流站</h3>
        
        <div class="flex gap-1 bg-slate-900 p-1 rounded-lg border border-slate-700">
          <template x-for="f in ['全部', '親情', '友情', '愛情']" :key="f">
            <button @click="filter = f" :class="filter === f ? 'bg-slate-700 text-emerald-400 font-bold' : 'text-slate-400'" class="px-2 py-1 rounded text-[10px] transition-all" x-text="f"></button>
          </template>
        </div>
      </div>

      <div class="space-y-3">
        <template x-for="post in filteredPosts" :key="post.id">
          <div class="bg-slate-800 rounded-2xl p-4 border border-slate-700 space-y-3 shadow-xl">
            <div class="flex justify-between items-start">
              <div>
                <div class="flex items-center gap-2">
                  <span class="font-bold text-sm text-slate-100" x-text="post.nickname"></span>
                  <span class="text-[10px] px-2 py-0.5 rounded bg-slate-700 text-emerald-400 font-medium" x-text="post.relationType"></span>
                </div>
                <span class="text-[10px] text-slate-400" x-text="post.time"></span>
              </div>
              <span class="text-xs font-bold px-2.5 py-1 rounded-full shadow" :class="post.net >= 0 ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-red-950 text-red-400 border border-red-800'" x-text="'淨值 ' + (post.net > 0 ? '+' : '') + post.net"></span>
            </div>

            <div class="flex gap-2">
              <span class="text-xs px-2.5 py-0.5 rounded-lg bg-amber-950/80 text-amber-300 border border-amber-800/50">幸福感 <span x-text="post.happiness"></span>/10</span>
              <span class="text-xs px-2.5 py-0.5 rounded-lg bg-slate-700/80 text-slate-300 font-medium" x-text="post.tag"></span>
            </div>

            <div class="grid grid-cols-2 gap-2 text-xs bg-slate-900/80 p-3 rounded-xl border border-slate-700/60">
              <div class="border-r border-slate-700 pr-2">
                <span class="text-red-400 font-bold block mb-1">🔴 投入 (<span x-text="post.costScore"></span>分)</span>
                <p class="text-slate-300 whitespace-pre-wrap leading-relaxed" x-text="post.costDesc || '無'"></p>
              </div>
              <div class="pl-1">
                <span class="text-emerald-400 font-bold block mb-1">🟢 收獲 (<span x-text="post.rewardScore"></span>分)</span>
                <p class="text-slate-300 whitespace-pre-wrap leading-relaxed" x-text="post.rewardDesc || '無'"></p>
              </div>
            </div>

            <div x-show="post.reflection" class="bg-indigo-950/40 p-3 rounded-xl border border-indigo-500/30 text-xs space-y-1">
              <span class="text-indigo-400 font-bold block">💬 總結與反思感想</span>
              <p class="text-slate-300 whitespace-pre-wrap leading-relaxed" x-text="post.reflection"></p>
            </div>

            <div class="flex justify-end pt-1">
              <button @click="likePost(post.id)" class="flex items-center gap-1.5 text-xs text-slate-300 bg-slate-700/60 hover:bg-slate-700 px-3 py-1.5 rounded-full border border-slate-600 transition-all">
                <span>❤️</span>
                <span x-text="post.likes"></span>
              </button>
            </div>
          </div>
        </template>
      </div>
    </section>

  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBVHGINoSRfMETVX9ts_JRRgWCKqxBmFbmM",
      authDomain: "relationship-ledger.firebaseapp.com",
      databaseURL: "https://relationship-ledger-default-rtdb.firebaseio.com/",
      projectId: "relationship-ledger",
      storageBucket: "relationship-ledger.firebasestorage.app",
      messagingSenderId: "579878838687",
      appId: "1:579878838687:web:83a2015a0be148f0b5ddaa"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function appData() {
      return {
        currentTab: 'quiz',
        filter: '全部',
        currentQIndex: 0,
        quizCompleted: false,
        scores: { A: 0, B: 0, C: 0, D: 0 },
        
        // 20 道隱晦的大學生生活情境題
        questions: [
          { q: "1. 當朋友在系上聚會中開了一個讓你略感不舒服的玩笑時，你的第一反應通常是？", options: [
            { text: "心裡默默受傷，但立刻告訴自己對方不是故意的，選擇包容。", type: "A" },
            { text: "找機會私下溫和聊聊，表達剛才那個話題讓你有甚麼樣的感受。", type: "B" },
            { text: "評估這個玩笑是否踩到界線，若消耗過多心力會減少互動。", type: "C" },
            { text: "笑笑帶過或轉移話題，覺得不需要太嚴肅看待。", type: "D" }
          ]},
          { q: "2. 面對長期向你傾倒負能量、反覆抱怨同一件事的朋友，你內心最常出現的想法是？", options: [
            { text: "他現在真的很脆弱、很需要陪伴，我要多接住他一些。", type: "A" },
            { text: "我想聽聽看他背後真正的渴望或困難到底是什麼。", type: "B" },
            { text: "我的精神成本已經開始透支了，需要適時踩煞車。", type: "C" },
            { text: "聽聽就好，不用太往心裡去，放輕鬆隨緣。", type: "D" }
          ]},
          { q: "3. 當你在分組報告中發現某個組員完全神隱、分工不均時，你會怎麼做？", options: [
            { text: "擔心直接說出來會破壞團隊和諧，通常選擇自己默默多做一點。", type: "A" },
            { text: "試著用客觀的現象與大家重新協調大家的負荷與需要。", type: "B" },
            { text: "直接提出具體的權責劃分，確保自己的付出與收穫對等。", type: "C" },
            { text: "順其自然，反正期末總會交出去的，不需要太計較。", type: "D" }
          ]},
          { q: "4. 當有人臨時放鳥你的約定時，你心裡的反應通常是？", options: [
            { text: "第一時間擔心對方是不是發生了什麼不好的事。", type: "A" },
            { text: "會想了解對方的難處，並表達自己空出時間卻落空的感受。", type: "B" },
            { text: "心裡默默扣分，下次要約他就會更加謹慎評估成本。", type: "C" },
            { text: "沒關係啊，剛好賺到一個人的自由時間，隨緣就好。", type: "D" }
          ]},
          { q: "5. 面對意見和你完全不同、甚至帶有攻擊性的言論時，你的應對方式是？", options: [
            { text: "為了避免起衝突，通常會選擇沉默或順著對方說。", type: "A" },
            { text: "試著拆解對方的觀點，找出大家共同在乎的價值是什麼。", type: "B" },
            { text: "若對方不講道理，直接劃清界線，懶得浪費口水爭辯。", type: "C" },
            { text: "笑笑點頭敷衍，心裡想著隨便你怎麼想。", type: "D" }
          ]},
          { q: "6. 當你在社群平台上看到朋友似乎在發文默默影射或抱怨你時，你會？", options: [
            { text: "整晚胡思亂想，覺得是不是自己哪裡做錯了惹人討厭。", type: "A" },
            { text: "找時間直接坦誠溝通，問清楚是不是有什麼誤會。", type: "B" },
            { text: "評估這段關係是否值得花心力維護，不值得就直接放水流。", type: "C" },
            { text: "滑過去當作沒看到，別人的情緒與我無關。", type: "D" }
          ]},
          { q: "7. 當你同時面臨一堆期末死線，而好朋友又剛好找你訴苦時，你會選擇？", options: [
            { text: "先放下自己的事，聽朋友講完再說，雖然自己壓力山大。", type: "A" },
            { text: "溫和地告訴對方自己的死線狀況，約定晚一點或改天再聊。", type: "B" },
            { text: "直接拒絕，清楚告訴對方目前精力不足無法負荷。", type: "C" },
            { text: "回個貼圖敷衍一下，繼續趕自己的報告。", type: "D" }
          ]},
          { q: "8. 你對於在人群中「表達自己真實的需求或感受」這件事的看法是？", options: [
            { text: "覺得很難出口，總是把別人的需求擺在自己前面。", type: "A" },
            { text: "覺得這是互相理解與建立深厚連結的必要過程。", type: "B" },
            { text: "只有對重要的人才會說，其他人不需要花力氣溝通。", type: "C" },
            { text: "隨緣啦，講不講得通都無所謂，順其自然就好。", type: "D" }
          ]},
          { q: "9. 當一段原本很好的友情或戀情漸漸變得平淡、甚至讓你感到內耗時，你會？", options: [
            { text: "拼命想要挽回，覺得是不是自己不夠努力。", type: "A" },
            { text: "嘗試和對方聊聊彼此目前的狀態與期待調整。", type: "B" },
            { text: "計算這段關係帶來的快樂與內耗，果斷進行停損。", type: "C" },
            { text: "順其自然淡掉，強求的緣分不會甜。", type: "D" }
          ]},
          { q: "10. 當你幫了別人一個忙，但對方卻連一聲謝謝也沒有時，你的反應是？", options: [
            { text: "心裡有點受傷，但安慰自己沒關係，幫忙本就不求回報。", type: "A" },

          { q: "13. 當你聽到身邊的人在吵架或意見不合時，你心裡的直覺反應是？", options: [

          { q: "18. 面對生活中的突發狀況或計畫被打亂時，你通常的反應是？", options: [

          { q: "19. 你對「拒絕別人」這件事的熟悉程度是？", options: [
            { text: "超級不擅長，每次拒絕罪惡感都滿出來。", type: "A" },
            { text: "能夠用溫和但堅定的態度表達自己的考量。", type: "B" },
            { text: "完全零障礙，不適合或會內耗的一律秒拒絕。", type: "C" },
            { text: "隨便啦，用開玩笑或推託的方式很輕鬆就帶過了。", type: "D" }
          ]},
          { q: "20. 對你而言，人際關係中的「付出」代表著什麼？", options: [
            { text: "是證明自己有價值、能被大家喜歡的方式。", type: "A" },
            { text: "是互相滋養、建立心靈連結的橋樑。", type: "B" },
            { text: "是一場需要雙向平衡、絕不能長期虧損的投資。", type: "C" },
            { text: "就是隨興所至，開心就好，不用想太多意義。", type: "D" }
          ]}
        ],

        form: { 
          isAnonymous: true, 
          nickname: '', 
          relationType: '友情', 
          costScore: 5, 
          costDesc: '', 
          rewardScore: 7, 
          rewardDesc: '', 
          happiness: 8,
          reflection: '' 
        },
        posts: [],

        init() {
          db.ref('posts').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
              this.posts = Object.keys(data).map(key => ({
                id: key,
                ...data[key]
              })).reverse();
            } else {
              this.posts = [];
            }
          });
        },

        get filteredPosts() {
          if (this.filter === '全部') return this.posts;
          return this.posts.filter(p => p.relationType === this.filter);
        },

        getEmoji(v) {
          if (v >= 8) return '🥰';
          if (v >= 6) return '😊';
          if (v >= 4) return '😐';
          return '😔';
        },

        answerQuestion(type) {
          this.scores[type]++;
          if (this.currentQIndex < this.questions.length - 1) {
            this.currentQIndex++;
          } else {
            this.quizCompleted = true;
          }
        },

        resetQuiz() {
          this.currentQIndex = 0;
          this.quizCompleted = false;
          this.scores = { A: 0, B: 0, C: 0, D: 0 };
        },

        get resultPersona() {
          // 找出 A, B, C, D 最高分的選項
          let maxType = 'A';
          let maxVal = -1;
          for (let k in this.scores) {
            if (this.scores[k] > maxVal) {
              maxVal = this.scores[k];
              maxType = k;
            }
          }

          if (maxType === 'A') {
            return {
              type: '共感覺察型',
              emoji: '🧋',
              title: '免費情緒勞動大代工',
              desc: '你是身邊朋友的 24 小時免費心理諮商所！動不動就接收到別人的情緒廢氣，明明自己報告也還沒寫完、期末快被當，還是忍不住一邊喊著「我真的會累死」，一邊默默幫別人順毛。主打一個「我痛苦但朋友不能難過」。',
              suggestedHappiness: 6,
              costText: '長期吸收身邊親友的負能量與情緒廢氣，精神成本極高。',
              rewardText: '獲得大家的高度依賴與溫暖的情感連結。',
              reflectionText: '測驗結果：雖然常常當情緒吸塵器累得半死，但心裡還是很在乎大家，需要學會好好照顧自己的界線。'
            };
          } else if (maxType === 'B') {
            return {
              type: '清明對話型',
              emoji: '🧠',
              title: '人間清醒大師 / 結巴終結者',
              desc: '你擁有超強的對話邏輯與同理心！當別人想情勒或開啟情緒化對話時，你總能冷靜拋出一句精準的對話，直接把對方的無效溝通降落。堪稱團體中的團康救星與溝通界清流。',
              suggestedHappiness: 9,
              costText: '需要花費心思傾聽、拆解對方的需求與客觀事實。',
              rewardText: '收穫高品質的深度理解、良好溝通與心靈共鳴。',
              reflectionText: '測驗結果：透過清晰的對話與非暴力溝通，讓每一次互動都成為滋養彼此的養分。'
            };
          } else if (maxType === 'C') {
            return {
              type: '界線平衡型',
              emoji: '⚖️',
              title: '精準停損的賽局玩家',
              desc: '你是人際關係裡的斜槓會計師！付出多少心力、得到多少快樂回報，心裡都有一張嚴格的成本效益表。一旦發現這段關係開始「內耗大於滋養」，秒開防禦結界、直接斷捨離。',
              suggestedHappiness: 8,
              costText: '設定嚴格界線與防禦成本，過濾掉不必要的消耗。',
              rewardText: '享有極高的自主權與乾淨清爽的社交圈。',
              reflectionText: '測驗結果：人際關係不是做慈善，懂得精準停損、保護自己的能量才是最高級的自我照顧。'
            };
          } else {
            return {
              type: '自在觀望型',
              emoji: '🍃',
              title: '佛系躺平漂流木',
              desc: '你把「隨緣」跟「不糾結」刻在DNA裡！對人際拉扯和社交局抱持著「隨風而去、隨遇而安」的態度。別人焦慮得要死，你永遠在旁邊喝手搖飲看戲，絕不內耗、絕不黏人。',
              suggestedHappiness: 8,
              costText: '幾近於零的社交內耗與精神成本。',
              rewardText: '獲得無拘無束的自由與隨遇而安的快樂。',
              reflectionText: '測驗結果：世事紛擾，主打一個隨緣過生活，地球轉一轉總會有辦法的，輕鬆看待一切。'
            };
          }
        },

        submitQuizResult() {
          const persona = this.resultPersona;
          this.form.costDesc = persona.costText;
          this.form.rewardDesc = persona.rewardText;
          this.form.reflection = persona.reflectionText;
          this.form.happiness = persona.suggestedHappiness;

          const net = this.form.rewardScore - this.form.costScore;
          let tag = '平衡狀態';
          if (net >= 4) tag = '高品質滋養';
          else if (net >= 2) tag = '穩健獲利';
          else if (net <= -3) tag = '嚴重透支警訊';
          else if (net < 0) tag = '情感赤字';

          const newPost = {
            nickname: this.form.isAnonymous ? '匿名' : (this.form.nickname || '路人'),
            relationType: this.form.relationType,
            costScore: this.form.costScore,
            costDesc: this.form.costDesc,
            rewardScore: this.form.rewardScore,
            rewardDesc: this.form.rewardDesc,
            happiness: this.form.happiness,
            reflection: `【心測結果：${persona.emoji} ${persona.title}】\n` + this.form.reflection,
            net: net,
            tag: tag,
            likes: 0,
            time: new Date().toLocaleString('zh-TW', { hour12: false, month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
          };

          db.ref('posts').push(newPost, (error) => {
            if (!error) {
              this.currentTab = 'board';
              this.resetQuiz();
            } else {
              alert('上傳失敗，請稍後再試！');
            }
          });
        },

        submitToCloud() {
          const net = this.form.rewardScore - this.form.costScore;
          let tag = '平衡狀態';
          if (net >= 4) tag = '高品質滋養';
          else if (net >= 2) tag = '穩健獲利';
          else if (net <= -3) tag = '嚴重透支警訊';
          else if (net < 0) tag = '情感赤字';

          const newPost = {
            nickname: this.form.isAnonymous ? '匿名' : (this.form.nickname || '路人'),
            relationType: this.form.relationType,
            costScore: this.form.costScore,
            costDesc: this.form.costDesc,
            rewardScore: this.form.rewardScore,
            rewardDesc: this.form.rewardDesc,
            happiness: this.form.happiness,
            reflection: this.form.reflection,
            net: net,
            tag: tag,
            likes: 0,
            time: new Date().toLocaleString('zh-TW', { hour12: false, month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
          };

          db.ref('posts').push(newPost, (error) => {
            if (!error) {
              this.form.costDesc = '';
              this.form.rewardDesc = '';
              this.form.reflection = '';
              this.currentTab = 'board';
            } else {
              alert('上傳失敗，請稍後再試！');
            }
          });
        },

        likePost(id) {
          const postRef = db.ref('posts/' + id);
          postRef.once('value', (snapshot) => {
            const post = snapshot.val();
            if (post) {
              postRef.update({ likes: (post.likes || 0) + 1 });
            }
          });
        }
      }
    }
  </script>
